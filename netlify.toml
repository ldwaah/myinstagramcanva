# My Instagram Canva — Netlify monorepo deploy (apps/web)
# https://docs.netlify.com/configure-builds/monorepos/
# Root netlify.toml only — do not add netlify.toml under templates/ (use .example).

[build]
  command = "npm ci --include=optional && npm run db:generate && npm run build -w web"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Tenant subdomains ({username}.myinstagramcanva.com) are rewritten by Next.js middleware.
# Add myinstagramcanva.com, www.myinstagramcanva.com, and *.myinstagramcanva.com in Netlify → Domain management.
