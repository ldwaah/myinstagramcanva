# My Instagram Canva — Netlify monorepo deploy (apps/web)

[build]
  command = "bash scripts/netlify-ci-build.sh"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "20"
  NPM_CONFIG_PRODUCTION = "false"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Tenant subdomains ({username}.myinstagramcanva.com) need wildcard DNS + Netlify domain alias.
# Until NEXT_PUBLIC_TENANT_SUBDOMAINS_ENABLED=true, the app shows /site/{username} URLs.
# DNS (at registrar or Cloudflare): CNAME * -> <site-name>.netlify.app
# Netlify UI: Domain management -> Add domain alias -> *.myinstagramcanva.com
