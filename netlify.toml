# My Instagram Canva — Netlify monorepo deploy (apps/web)
# base = apps/web selects the web workspace on CI builders.

[build]
  base = "apps/web"
  command = "cd ../.. && NPM_CONFIG_PRODUCTION=false npm ci --include=optional && npm install --include=optional -w web && npm run db:generate && npm run build -w web"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_CONFIG_PRODUCTION = "false"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Tenant subdomains ({username}.myinstagramcanva.com) are rewritten by Next.js middleware.
