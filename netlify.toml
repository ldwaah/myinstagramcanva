# My Instagram Canva — Netlify monorepo deploy (apps/web)
# https://docs.netlify.com/frameworks/next-js/overview/

[build]
  command = "npm install && npm install --include=optional -w web && NETLIFY= npm run db:generate && npm run build -w web"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Tenant subdomains (www.{username}.myinstagramcanva.com) are rewritten by Next.js middleware.
# Add myinstagramcanva.com, www.myinstagramcanva.com, and *.myinstagramcanva.com in Netlify → Domain management.
