# My Instagram Canva — Netlify monorepo deploy (apps/web)

[build]
  command = "bash scripts/netlify-ci-build.sh"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "20"
  NPM_CONFIG_PRODUCTION = "false"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Tenant subdomains ({username}.myinstagramcanva.com) are rewritten by Next.js middleware.
