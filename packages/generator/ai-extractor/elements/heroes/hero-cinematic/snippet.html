<section class="el-hero-cine" aria-label="Introduction">
  <div class="el-hero-cine__bg">
    <img src="{{HERO_IMAGE_URL}}" alt="{{BRAND_NAME}}" width="1920" height="2560" fetchpriority="high" />
    <div class="el-hero-cine__vignette"></div>
  </div>
  <div class="el-hero-cine__content">
    <p class="el-hero-cine__eyebrow"><span class="el-pulse"></span>{{HERO_EYEBROW}}</p>
    <h1 class="el-hero-cine__title">{{HERO_TITLE_LINES}}</h1>
    <p class="el-hero-cine__sub">{{HERO_SUBTITLE}}</p>
    <div class="el-hero-cine__actions">
      <a class="el-btn el-btn--primary" href="#work">View portfolio</a>
      <a class="el-btn el-btn--ghost" href="{{IG_URL}}" target="_blank" rel="noopener noreferrer">@{{HANDLE}}</a>
    </div>
  </div>
  <div class="el-hero-cine__ticker" aria-hidden="true">
    <div class="el-ticker-track">
      <span>{{MARQUEE_TEXT}}</span>
      <span>{{MARQUEE_TEXT}}</span>
    </div>
  </div>
</section>
