<section class="el-hero-split" aria-label="Introduction">
  <div class="el-hero-split__grid">
    <div class="el-hero-split__copy">
      <p class="el-hero-split__eyebrow">{{HERO_EYEBROW}}</p>
      <h1 class="el-hero-split__title">{{HERO_TITLE}}</h1>
      <p class="el-hero-split__sub">{{HERO_SUBTITLE}}</p>
      <div class="el-hero-split__actions">
        <a class="el-btn el-btn--primary" href="#work">See portfolio</a>
        <a class="el-btn el-btn--ghost" href="{{IG_URL}}" target="_blank" rel="noopener noreferrer">Instagram</a>
      </div>
    </div>
    <div class="el-hero-split__visual">
      <img src="{{HERO_IMAGE_URL}}" alt="{{BRAND_NAME}}" width="640" height="800" fetchpriority="high" />
    </div>
  </div>
</section>
