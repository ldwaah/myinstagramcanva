<section class="el-hero-profile" aria-label="Profile">
  <div class="el-hero-profile__inner">
    <div class="el-hero-profile__avatar">
      <img src="{{AVATAR_URL}}" alt="{{BRAND_NAME}}" width="160" height="160" fetchpriority="high" />
    </div>
    <div class="el-hero-profile__meta">
      <h1 class="el-hero-profile__name">{{BRAND_NAME}}</h1>
      <p class="el-hero-profile__handle">@{{HANDLE}}</p>
      <div class="el-hero-profile__stats">{{STATS_ROW}}</div>
      <p class="el-hero-profile__bio">{{HERO_SUBTITLE}}</p>
      <div class="el-hero-profile__actions">
        <a class="el-btn el-btn--primary" href="#contact">Get in touch</a>
        <a class="el-btn el-btn--secondary" href="{{IG_URL}}" target="_blank" rel="noopener noreferrer">Follow</a>
      </div>
    </div>
  </div>
</section>
