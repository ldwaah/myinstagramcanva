<section class="el-hero-bleed" aria-label="Introduction">
  <div class="el-hero-bleed__bg">
    <img src="{{HERO_IMAGE_URL}}" alt="{{BRAND_NAME}}" width="1920" height="1080" fetchpriority="high" />
    <div class="el-hero-bleed__overlay"></div>
  </div>
  <div class="el-hero-bleed__content">
    <p class="el-hero-bleed__eyebrow">{{HERO_EYEBROW}}</p>
    <h1 class="el-hero-bleed__title">{{HERO_TITLE}}</h1>
    <p class="el-hero-bleed__sub">{{HERO_SUBTITLE}}</p>
    <a class="el-btn el-btn--primary" href="#work">Explore work</a>
  </div>
</section>
