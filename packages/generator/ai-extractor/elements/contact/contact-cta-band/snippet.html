<section id="contact" class="el-contact-band" aria-labelledby="el-contact-band-heading">
  <div class="el-contact-band__inner">
    <span class="el-section-tag">04 · Contact</span>
    <h2 id="el-contact-band-heading">{{CONTACT_TITLE}}</h2>
    <p>{{CONTACT_SUBTITLE}}</p>
    <div class="el-contact-band__links">
      <a class="el-contact-band__link" href="{{IG_URL}}" target="_blank" rel="noopener noreferrer">
        <span class="el-contact-band__label">Instagram</span>
        <span class="el-contact-band__value">@{{HANDLE}}</span>
      </a>
      {{PHONE_LINK}}
    </div>
    <a class="el-btn el-btn--primary el-btn--large" href="{{IG_URL}}" target="_blank" rel="noopener noreferrer">Start a conversation</a>
  </div>
</section>
