<section class="el-album-promo" id="release" aria-label="Featured release">
  <div class="el-album-promo__inner">
    <div class="el-album-promo__cover">
      <img src="{{HERO_IMAGE_URL}}" alt="{{ALBUM_TITLE}}" loading="lazy" width="400" height="400" />
    </div>
    <div class="el-album-promo__copy">
      <span class="el-section-tag">Out now</span>
      <h2>{{ALBUM_TITLE}}</h2>
      <p>{{ALBUM_SUBTITLE}}</p>
      <div class="el-album-promo__actions">
        <a class="el-btn el-btn--primary" href="{{STREAM_URL}}" target="_blank" rel="noopener noreferrer">Listen now</a>
        <a class="el-btn el-btn--ghost" href="{{IG_URL}}" target="_blank" rel="noopener noreferrer">Follow @{{HANDLE}}</a>
      </div>
    </div>
  </div>
</section>
