<section class="el-product-grid" id="shop" aria-label="Featured products">
  <div class="el-product-grid__head el-section-head">
    <span class="el-section-tag">Shop</span>
    <h2>{{PRODUCTS_TITLE}}</h2>
    <p>{{PRODUCTS_SUBTITLE}}</p>
  </div>
  <div class="el-product-grid__items">{{PRODUCTS_ITEMS}}</div>
  <div class="el-product-grid__cta">
    <a class="el-btn el-btn--primary" href="{{SHOP_URL}}" target="_blank" rel="noopener noreferrer">{{SHOP_CTA}}</a>
  </div>
</section>
