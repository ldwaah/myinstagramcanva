<section id="about" class="el-about-split" aria-labelledby="el-about-heading">
  <div class="el-about-split__grid">
    <div class="el-about-split__visual">
      <div class="el-about-split__frame">
        <img src="{{HERO_IMAGE_URL}}" alt="{{BRAND_NAME}}" width="560" height="700" loading="lazy" />
      </div>
      <div class="el-about-split__badge">{{ABOUT_BADGE}}</div>
    </div>
    <div class="el-about-split__copy">
      <span class="el-section-tag">02 · About</span>
      <h2 id="el-about-heading">{{ABOUT_TITLE}}</h2>
      <p>{{ABOUT_BODY}}</p>
      <ul class="el-about-split__list">{{ABOUT_BULLETS}}</ul>
      <a class="el-btn el-btn--primary" href="#contact">Get in touch</a>
    </div>
  </div>
</section>
